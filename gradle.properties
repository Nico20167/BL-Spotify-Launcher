# Mémoire allouée au démon Gradle.
# trustStoreType=Windows-ROOT : la JVM utilise le magasin de certificats Windows
# (nécessaire derrière un proxy/antivirus qui intercepte le TLS — sinon erreur PKIX
# au téléchargement des dépendances).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=Windows-ROOT

# AndroidX obligatoire pour Compose.
android.useAndroidX=true

# R class non transitive : chaque module n'expose que ses propres ressources (recommandé).
android.nonTransitiveRClass=true

# Style de code Kotlin.
kotlin.code.style=official
