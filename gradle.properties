# Mémoire allouée au démon Gradle.
# Réglages propres à une machine (ex. proxy/antivirus qui intercepte le TLS →
# -Djavax.net.ssl.trustStoreType=Windows-ROOT) : à mettre dans
# ~/.gradle/gradle.properties, qui a priorité, PAS ici (casserait les autres OS).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX obligatoire pour Compose.
android.useAndroidX=true

# R class non transitive : chaque module n'expose que ses propres ressources (recommandé).
android.nonTransitiveRClass=true

# Style de code Kotlin.
kotlin.code.style=official
